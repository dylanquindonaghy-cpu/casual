name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftdesk
          POSTGRES_PASSWORD: shiftdesk
          POSTGRES_DB: shiftdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftdesk -d shiftdesk"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # Same three roles as .env.example. The test setup creates the owner and app roles and a
    # fresh shiftdesk_test database, so tests run exactly as locally (never as the superuser).
    env:
      DATABASE_URL: postgres://shiftdesk_app:app_dev_password@localhost:5432/shiftdesk
      DATABASE_JOBS_URL: postgres://shiftdesk_jobs:jobs_dev_password@localhost:5432/shiftdesk
      DATABASE_ADMIN_URL: postgres://shiftdesk:shiftdesk@localhost:5432/shiftdesk?options=-c%20role%3Dshiftdesk_owner
      APP_BASE_DOMAIN: localhost:3000
      SESSION_SECRET: ci-only-secret-not-for-any-real-use-0123
      MESSAGING_TRANSPORT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same script as local: typecheck, lint, test, invariants.
      - run: ./scripts/verify.sh
      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .claude/state/*.log

  e2e:
    # Browser tests of DB-backed flows (worker login). Playwright rebuilds and seeds its own
    # shiftdesk_e2e database and starts the web app and the worker itself.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftdesk
          POSTGRES_PASSWORD: shiftdesk
          POSTGRES_DB: shiftdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftdesk -d shiftdesk"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://shiftdesk_app:app_dev_password@localhost:5432/shiftdesk
      DATABASE_JOBS_URL: postgres://shiftdesk_jobs:jobs_dev_password@localhost:5432/shiftdesk
      DATABASE_ADMIN_URL: postgres://shiftdesk:shiftdesk@localhost:5432/shiftdesk?options=-c%20role%3Dshiftdesk_owner
      SESSION_SECRET: ci-only-secret-not-for-any-real-use-0123
      MESSAGING_TRANSPORT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
