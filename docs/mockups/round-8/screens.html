<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShiftDesk office round 8 screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Every round 8 office screen, one at a time: open with #<screen>-<laptop|phone>
   (dashboard, event, casuals, cancellations, session, updates, offer, customise). The source of the
   "after" pictures on the UI change spec (docs/mockups/round-8/spec/). Figures are the live demo's,
   except reliability and "asked" times, which are examples (the demo has no 90 days of history). */
* { box-sizing: border-box; }
body { margin: 0; background: #0c0c0d; }
/* =================== round 8: the office (inside the frames) =================== */
.f8 {
  --g0: #0f0f10;  /* the window and the rail */
  --g1: #141415;  /* the page ground */
  --p1: #1b1b1d;  /* a panel */
  --p2: #232325;  /* a tile, a chip, a row inside a panel */
  --p3: #2c2c2f;  /* a control, hover, the selected tab */
  --edge: #29292c; --edge2: #343438;
  --ink: #f4f4f3; --muted: #a2a2a7; --faint: #8c8c91;
  --hv: #e9f86f; --on-hv: #171800; --hv-soft: rgb(233 248 111 / 0.12);
  --red: #ff8a80; --red-bg: #3a1a19; --red-fill: #e5484d;
  --amb: #f2b55a; --amb-bg: #33260f; --amb-line: #5a4318;
  --grn: #8fe28c; --grn-bg: #15291a;
  --blu: #8ab4ff; --blu-bg: #172338;
  width: 1280px; container-type: inline-size; background: var(--g0); color: var(--ink);
  font: 14px/1.45 "Geist", ui-sans-serif, system-ui, sans-serif; position: relative; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
.f8.phone { width: 390px; }
.f8 svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.f8 svg.i.s { width: 15px; height: 15px; } .f8 svg.i.xs { width: 13px; height: 13px; }
.f8 .shell { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 20px; padding: 18px 22px 26px 14px; }
.f8 .rail { background: var(--g1); border: 1px solid var(--edge); border-radius: 24px; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; height: 760px; }
.f8 .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--hv); color: var(--on-hv); display: grid; place-items: center; font-weight: 600; font-size: 16px; }
.f8 .rail .sep { width: 28px; height: 1px; background: var(--edge); margin: 4px 0; }
.f8 .rb { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--p1); border: 1px solid var(--edge); position: relative; }
.f8 .rb.on { background: #fff; color: #111; border-color: #fff; }
.f8 .rb .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--red-fill); box-shadow: 0 0 0 2px var(--g1); }
.f8 .rail .grow { flex: 1; }
.f8 .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; min-width: 0; }
.f8 .top { display: flex; align-items: center; gap: 8px; }
.f8 .chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--p2); border: 1px solid var(--edge); color: var(--muted); white-space: nowrap; font-size: 13px; }
.f8 .chip b { color: var(--ink); font-weight: 600; }
.f8 .chip.u b { color: var(--red); }
.f8 .search { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 36px; width: 270px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--p1); border: 1px solid var(--edge); color: var(--faint); font-size: 13px; white-space: nowrap; overflow: hidden; }
.f8 .search kbd { margin-left: auto; font: 500 11px "Geist Mono", monospace; color: var(--muted); background: var(--p3); border-radius: 999px; padding: 3px 8px; }
.f8 .vr { width: 1px; height: 26px; background: var(--edge); margin: 0 6px; }
.f8 .bell { width: 36px; height: 36px; border-radius: 50%; background: var(--p1); border: 1px solid var(--edge); display: grid; place-items: center; position: relative; color: var(--ink); }
.f8 .bell .n { position: absolute; top: -5px; right: -7px; background: var(--red-fill); color: #fff; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 1px 5px; }
.f8 .me { display: flex; align-items: center; gap: 9px; margin-left: 6px; }
.f8 .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; background: #2e3112; color: var(--hv); flex: none; }
.f8 .me small { display: block; color: var(--faint); font-size: 11.5px; line-height: 1.2; }
.f8 .me b { display: block; font-weight: 500; font-size: 13px; line-height: 1.2; white-space: nowrap; }
.f8 .crumb { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 13px; }
.f8 .crumb b { color: var(--ink); font-weight: 500; }
.f8 .titlerow { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.f8 h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; display: flex; align-items: center; gap: 12px; }
.f8 .sub { color: var(--faint); font-size: 13px; margin-top: 4px; }
.f8 .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--p2); border: 1px solid var(--edge2); color: var(--ink); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.f8 .btn.hv { background: var(--hv); color: var(--on-hv); border-color: var(--hv); font-weight: 600; }
.f8 .btn.sm { height: 30px; padding: 0 12px; font-size: 12.5px; }
.f8 .btn.icon { width: 38px; padding: 0; }
.f8 .btn.sm.icon { width: 30px; }
.f8 .btn.red { color: var(--red); }
.f8 .row { display: flex; align-items: center; gap: 10px; }
.f8 .tabs { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--p1); border: 1px solid var(--edge); }
.f8 .tabs > span { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; }
.f8 .tabs > span.on { background: var(--p3); color: var(--ink); }
.f8 .cnt { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--p3); color: var(--muted); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.f8 .tabs > span.on .cnt { background: #fff; color: #111; }
.f8 .cnt.u { background: var(--red-fill); color: #fff; }
.f8 .tg { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.f8 .sw { width: 38px; height: 22px; border-radius: 999px; background: var(--p3); border: 1px solid var(--edge2); position: relative; }
.f8 .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #6d6d72; }
.f8 .sw.on { background: var(--hv); border-color: var(--hv); } .f8 .sw.on::after { left: 18px; background: #171800; }
.f8 .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; flex: none; }
.f8 .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.f8 .pill.u { color: var(--red); background: var(--red-bg); }
.f8 .pill.o { color: var(--amb); background: var(--amb-bg); }
.f8 .pill.b { color: var(--grn); background: var(--grn-bg); }
.f8 .pill.w { color: var(--blu); background: var(--blu-bg); }
.f8 .pill.q { color: var(--muted); background: var(--p3); }
.f8 .tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--p3); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.f8 .tag.a { color: var(--amb); background: var(--amb-bg); }
.f8 .panel { background: var(--p1); border: 1px solid var(--edge); border-radius: 20px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.f8 .ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.f8 .ph h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.f8 .ph h3 .i { color: var(--muted); }
.f8 .tile { background: var(--p2); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.f8 .muted { color: var(--muted); } .f8 .faint { color: var(--faint); } .f8 .small { font-size: 12.5px; }
.f8 .mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; }
.f8 .bar { height: 6px; border-radius: 999px; background: var(--p3); overflow: hidden; }
.f8 .bar i { display: block; height: 100%; border-radius: 999px; background: var(--amb); }
.f8 .bar.g i { background: var(--grn); } .f8 .bar.r i { background: var(--red-fill); }
.f8 .notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 12px; background: var(--amb-bg); border: 1px solid var(--amb-line); color: #f6dcb0; font-size: 13px; }
.f8 .notice .i { color: var(--amb); margin-top: 1px; }
.f8 .notice b { color: #fff3dc; font-weight: 600; }
.f8 .dt { width: 42px; flex: none; text-align: center; border-radius: 11px; background: var(--p3); padding: 5px 0; line-height: 1.1; }
.f8 .dt small { display: block; font-size: 10.5px; color: var(--muted); }
.f8 .dt b { font-size: 16px; font-weight: 600; }
.f8 .dt.u { background: var(--red-bg); } .f8 .dt.u small { color: var(--red); }
.f8 .list { display: grid; gap: 8px; }
.f8 .li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--p2); border: 1px solid var(--edge); }
.f8 .li b { font-weight: 600; display: block; }
.f8 .li .meta { color: var(--faint); font-size: 12.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.f8 .more { text-align: center; color: var(--muted); font-size: 13px; padding-top: 2px; }
.f8 .feed { display: grid; }
.f8 .ev { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--edge); align-items: start; }
.f8 .ev:first-child { padding-top: 0; } .f8 .ev:last-child { border-bottom: 0; padding-bottom: 0; }
.f8 .evi { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--p3); color: var(--muted); }
.f8 .evi.u { background: var(--red-bg); color: var(--red); } .f8 .evi.b { background: var(--grn-bg); color: var(--grn); } .f8 .evi.o { background: var(--amb-bg); color: var(--amb); }
.f8 .ev b { font-weight: 500; display: block; } .f8 .ev .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
.f8 .wk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--edge); }
.f8 .wk:last-child { border-bottom: 0; }
.f8 .grp { color: var(--faint); font-size: 12px; padding-top: 6px; display: flex; justify-content: space-between; }
/* the map */
.f8 .map { position: relative; height: 528px; border-radius: 22px; overflow: hidden; border: 1px solid var(--edge); background: #18181a; }
.f8 .map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.f8 .pin { position: absolute; transform: translate(-17px, -50%); display: flex; align-items: center; gap: 8px; }
.f8 .pin.l { flex-direction: row-reverse; transform: translate(calc(-100% + 17px), -50%); }
.f8 .pin .dotp { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: #2a2a2d; color: var(--ink); border: 2px solid var(--amb); }
.f8 .pin.u .dotp { background: var(--red-fill); border-color: var(--red-fill); color: #fff; }
.f8 .pin.h .dotp { border-style: dashed; border-color: #6d6d72; color: var(--muted); }
.f8 .pin.sel .dotp { box-shadow: 0 0 0 6px rgb(233 248 111 / 0.22), 0 0 0 14px rgb(233 248 111 / 0.08); border-color: var(--hv); }
.f8 .pin .lab { background: rgb(20 20 21 / 0.9); border: 1px solid var(--edge); border-radius: 10px; padding: 4px 8px; font-size: 12px; line-height: 1.25; white-space: nowrap; }
.f8 .pin .lab small { display: block; color: var(--faint); font-size: 11px; }
.f8 .mapctl { position: absolute; right: 14px; bottom: 14px; display: grid; gap: 8px; }
.f8 .mapctl span { width: 34px; height: 34px; border-radius: 50%; background: var(--p2); border: 1px solid var(--edge2); display: grid; place-items: center; color: var(--muted); }
.f8 .maplegend { position: absolute; right: 14px; top: 14px; display: flex; gap: 6px; }
.f8 .maplegend .tag { background: rgb(27 27 29 / 0.92); border: 1px solid var(--edge); }
.f8 .maplegend .k { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--amb); background: #2a2a2d; }
.f8 .maplegend .k.u { background: var(--red-fill); border-color: var(--red-fill); }
.f8 .maplegend .k.h { border-color: #6d6d72; border-style: dashed; }
.f8 .card { position: absolute; left: 14px; top: 14px; width: 404px; background: var(--p1); border: 1px solid var(--edge2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 18px 50px rgb(0 0 0 / 0.5); }
.f8 .mapfoot { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; padding: 0 4px; }
.f8 .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.f8 .cols3 > .panel { display: flex; flex-direction: column; }
.f8 .cols3 > .panel > .more { margin-top: auto; }
.f8 .two > * { min-width: 0; }
.f8 .gauge { display: grid; place-items: center; position: relative; height: 96px; }
.f8 .gauge svg { width: 150px; height: 84px; }
.f8 .gauge .gv { position: absolute; bottom: 4px; text-align: center; line-height: 1.1; }
.f8 .gauge .gv b { font-size: 22px; font-weight: 600; } .f8 .gauge .gv small { display: block; color: var(--faint); font-size: 11.5px; }
.f8 .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.f8 .kv small { display: block; color: var(--faint); font-size: 12px; } .f8 .kv b { font-weight: 500; font-size: 13.5px; }
/* event page */
.f8 .ulTabs { display: flex; gap: 22px; border-bottom: 1px solid var(--edge); overflow-x: auto; scrollbar-width: none; }
.f8 .ulTabs > span { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 0 2px 12px; color: var(--muted); font-weight: 500; font-size: 13.5px; margin-bottom: -1px; }
.f8 .ulTabs > span.on { color: var(--ink); border-bottom: 2px solid var(--ink); }
.f8 .two { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.f8 .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
.f8 .metric { padding: 12px 14px; display: grid; gap: 7px; }
.f8 .metric + .metric { border-left: 1px solid var(--edge); }
.f8 .metric .big { font-size: 22px; font-weight: 600; } .f8 .metric .big span { color: var(--faint); font-size: 14px; font-weight: 400; }
.f8 .bay { display: grid; gap: 10px; }
.f8 .bay-h { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; }
.f8 .bay-h b { color: var(--ink); font-weight: 600; }
.f8 .slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.f8 .slots.s7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.f8 .slot { border-radius: 12px; background: var(--p2); border: 1px solid var(--edge); padding: 9px 10px; display: grid; gap: 6px; align-content: center; min-width: 0; min-height: 58px; }
.f8 .slots.s7 .slot { padding: 9px 10px; }
.f8 .slots.s7 .who .av { display: none; }
.f8 .slot .who { display: flex; gap: 7px; align-items: center; min-width: 0; }
.f8 .slot .who .av { width: 24px; height: 24px; font-size: 9.5px; }
.f8 .slot .who span { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f8 .slot .t { color: var(--faint); font-size: 11px; }
.f8 .slot.open { background: transparent; border: 1.5px dashed var(--amb-line); }
.f8 .slot.open .lab { color: var(--amb); font-size: 12.5px; font-weight: 600; }
.f8 .slot.urg { background: var(--red-bg); border: 1.5px solid var(--red-fill); }
.f8 .slot.urg .lab { color: var(--red); font-size: 12.5px; font-weight: 600; }
.f8 .slot.sel { outline: 2px solid var(--hv); outline-offset: 2px; }
.f8 .oc { border-radius: 16px; background: var(--p2); border: 1px solid var(--edge); padding: 12px 14px; display: grid; gap: 10px; }
.f8 .oc.sel { border-color: var(--edge2); background: #252527; }
.f8 .oc .top2 { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.f8 .oc b { font-weight: 600; }
.f8 .hr { height: 1px; background: var(--edge); }
/* the phone */
.f8 .pbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.f8 .pbar .title { flex: 1; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.f8 .pbar .title .mark { width: 28px; height: 28px; border-radius: 9px; font-size: 13px; }
.f8 .pmain { padding: 8px 16px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.f8 .scrollx { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
@container (max-width: 600px) {
  .f8 h1 { font-size: 24px; }
  .f8 .map { height: 300px; border-radius: 18px; }
  .f8 .card { position: relative; left: auto; top: auto; width: auto; box-shadow: none; margin-top: -40px; z-index: 2; }
  .f8 .cols3, .f8 .two { grid-template-columns: minmax(0, 1fr); }
  .f8 .slots, .f8 .slots.s7 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .f8 .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .f8 .metric { padding: 10px 8px; } .f8 .metric .big { font-size: 18px; }
  .f8 .pin .lab { display: none; }
  .f8 .crumb { display: none; }
  .f8 .maplegend { display: none; }
  .f8 .hide-phone { display: none !important; }
  .f8 .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
}
@container (min-width: 601px) { .f8 .only-phone { display: none !important; } }
.f8 .back { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 4px; }

/* round 8: the other office screens */
.f8 .panel, .f8 .sheet { grid-template-columns: minmax(0, 1fr); }
.f8 .tabs { min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.f8 .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--p1); border: 1px solid var(--edge); border-radius: 20px; }
.f8 .kpi { padding: 14px 18px; display: grid; gap: 3px; }
.f8 .kpi + .kpi { border-left: 1px solid var(--edge); }
.f8 .kpi b { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
.f8 .thead { display: grid; gap: 12px; padding: 0 12px; color: var(--faint); font-size: 12px; }
.f8 .li.casrow, .f8 .thead.casrow { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, 1fr) 130px 150px; }
.f8 .li.canrow, .f8 .thead.canrow { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1.1fr) 100px 220px; }
.f8 .li.sesrow, .f8 .thead.sesrow { grid-template-columns: minmax(0, 1.6fr) 100px 56px 104px 104px; }
.f8 .li.offrow { grid-template-columns: minmax(0, 1fr) auto auto; }
.f8 .li.hot { background: var(--red-bg); border-color: #5a2423; box-shadow: inset 3px 0 0 var(--red-fill); }
.f8 .stack2 { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.f8 .who2 { display: flex; gap: 10px; align-items: center; min-width: 0; }
.f8 .who2 b { display: block; font-weight: 600; }
.f8 .av2 { width: 34px; height: 34px; background: #26262a; color: #d6d6da; font-size: 11px; }
.f8 .rel { display: grid; gap: 5px; }
.f8 .rel b { font-weight: 600; font-size: 13.5px; }
.f8 .strike { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--red-fill); color: #fff; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.f8 .setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; background: var(--p2); border: 1px solid var(--edge); }

  // ---------- the map's streets (drawn, not a real place) ----------
  function drawMap(cv) {
    var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = cv.offsetWidth, h = cv.offsetHeight; if (!w || !h) return;
    cv.width = w * dpr; cv.height = h * dpr;
    var c = cv.getContext('2d'); c.scale(dpr, dpr);
    var s = 7; function rnd() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
    c.fillStyle = '#18181a'; c.fillRect(0, 0, w, h);
    // a river
    c.strokeStyle = '#121518'; c.lineWidth = Math.max(18, w * 0.03); c.lineCap = 'round';
    c.beginPath(); c.moveTo(-20, h * 0.62); c.bezierCurveTo(w * 0.25, h * 0.5, w * 0.4, h * 0.95, w * 0.62, h * 0.88); c.bezierCurveTo(w * 0.8, h * 0.82, w * 0.9, h * 1.02, w + 20, h * 0.96); c.stroke();
    // parks
    c.fillStyle = '#1a1d1b';
    [[0.12, 0.18, 0.1, 0.12], [0.78, 0.66, 0.08, 0.1], [0.3, 0.7, 0.07, 0.08]].forEach(function (p) { c.beginPath(); c.roundRect ? c.roundRect(p[0] * w, p[1] * h, p[2] * w, p[3] * h, 10) : c.rect(p[0] * w, p[1] * h, p[2] * w, p[3] * h); c.fill(); });
    // minor streets: a tilted grid with breaks
    c.save(); c.translate(w / 2, h / 2); c.rotate(-0.28); c.lineCap = 'butt';
    var step = Math.max(26, w / 40), R = Math.max(w, h);
    c.strokeStyle = '#222224'; c.lineWidth = 2.2;
    for (var x = -R; x < R; x += step * (0.8 + rnd() * 0.6)) { c.beginPath(); var y = -R; c.moveTo(x, y); while (y < R) { y += step * (1 + rnd() * 3); if (rnd() < 0.18) c.moveTo(x + (rnd() - 0.5) * 4, y); else c.lineTo(x + (rnd() - 0.5) * 4, y); } c.stroke(); }
    for (var yy = -R; yy < R; yy += step * (0.8 + rnd() * 0.6)) { c.beginPath(); var xx = -R; c.moveTo(xx, yy); while (xx < R) { xx += step * (1 + rnd() * 3); if (rnd() < 0.18) c.moveTo(xx, yy + (rnd() - 0.5) * 4); else c.lineTo(xx, yy + (rnd() - 0.5) * 4); } c.stroke(); }
    c.restore();
    // main roads
    c.strokeStyle = '#2d2d30'; c.lineWidth = 5; c.lineCap = 'round'; c.lineJoin = 'round';
    for (var k = 0; k < 7; k++) {
      c.beginPath(); var px = rnd() * w, py = k % 2 ? -10 : h + 10, ang = (k % 2 ? 1 : -1) * (Math.PI / 2) + (rnd() - 0.5) * 0.9;
      c.moveTo(px, py);
      for (var n = 0; n < 40; n++) { ang += (rnd() - 0.5) * 0.35; px += Math.cos(ang) * 26; py += Math.sin(ang) * 26; c.lineTo(px, py); }
      c.stroke();
    }
    // a ring road
    c.strokeStyle = '#2a2a2d'; c.lineWidth = 6; c.beginPath(); c.ellipse(w * 0.6, h * 0.5, w * 0.36, h * 0.46, -0.1, 0, Math.PI * 2); c.stroke();
  }

      '<b style="margin-top:6px">What you see</b><div class="picks">' + k(true, 'Venue map', 'Places to fill at each venue') + k(true, 'To offer', 'Sessions with places') + k(true, 'Updates', 'Cancellations and to-dos') + k(true, 'Who worked?', 'To confirm after a session') + k(false, 'Cancellations', 'By week, under 48 hours in red') + k(false, 'Watch list', 'Least reliable who are booked') + k(false, 'Fill rate', 'Booked of needed, per contract') + k(false, 'No-shows', 'By week') + '</div>' +
      '<span class="btn hv" style="margin-top:4px">Save my dashboard</span></div>';
    if (size === 'phone') return shell(panel, size, { rail: 'home', title: 'Customise' });
    return '<div style="position:relative">' + dashboard(size) + '<div class="dim"></div>' + panel.replace('class="sheet"', 'class="sheet side"') + '</div>';
  }

  var SCREENS = { dashboard: dashboard, event: eventPage, casuals: casuals, cancellations: cancellations, session: session, updates: updates, offer: offer, customise: customise };
  var m = (location.hash || '').match(/^#(\w+)-(laptop|phone)$/);
  var name = m ? m[1] : 'dashboard', size = m ? m[2] : 'laptop';
  document.getElementById('out').innerHTML = '<div class="f8 ' + size + '">' + SCREENS[name](size) + '</div>';
  document.querySelectorAll('#out canvas').forEach(drawMap);
  window.SCREEN_READY = true;
})();
</script></body></html>
