# ShiftDesk on the server (Phase 8; docs/architecture.md "Deployment", docs/runbooks.md "Deploy").
# Lives in /opt/shiftdesk with the Caddyfile, deploy.sh and one root-only .env holding every value
# below (docs/runbooks.md lists them). Each service is given only what it needs: the owner's
# database login (DATABASE_ADMIN_URL) only to the one-off migrate step, the jobs login only to the
# worker and migrate. Only Caddy is reachable from outside (80 and 443); the web app listens inside
# the server's Docker network alone. deploy.sh pulls new images and runs migrate, then up.
name: shiftdesk

x-app-image: &app-image ${SHIFTDESK_IMAGE:?set SHIFTDESK_IMAGE in .env (ghcr.io/<owner>/<repo>)}:${SHIFTDESK_TAG:-main}

# The database's CA certificate (the host's: docs/runbooks.md "Set up the server (once)"), saved in
# secrets/ next to this file (/opt/shiftdesk/secrets/db-ca.pem; a public certificate, so readable:
# chmod 644), read-only for every service that connects to the database. Every connection is
# checked against it (sslmode=verify-full&sslrootcert=/app/db-ca.pem in .env). Never created: if
# the file is missing, Docker refuses to start rather than mounting an empty folder there.
x-db-ca: &db-ca
  type: bind
  source: ./secrets/db-ca.pem
  target: /app/db-ca.pem
  read_only: true
  bind:
    create_host_path: false

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: *app-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:?}
      DATABASE_URL: ${DATABASE_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      ALERTS_TRANSPORT: ${ALERTS_TRANSPORT:-console}
      # The phones' offline copy of My shifts: "off" switches it off (docs/runbooks.md "A bad service
      # worker").
      OFFLINE_COPY: ${OFFLINE_COPY:-on}
      # Postcode look-ups (Settings, Profile): fake knows only the made-up ZZ postcodes.
      TRAVEL_PROVIDER: ${TRAVEL_PROVIDER:-fake}
      # Only whether AI sorting is on, for the Enquiries banner (not a secret; the key stays with
      # the worker).
      AI_TRANSPORT: ${AI_TRANSPORT:-none}
      # The planner API (12J.1; docs/runbooks.md "The planner integration secret"). Empty: every
      # call answers 503. A secret.
      INTEGRATIONS_SECRET: ${INTEGRATIONS_SECRET:-}
    volumes:
      - *db-ca
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # Runs from day one (P2.5): with no text sender yet (MESSAGING_TRANSPORT=none, the default here)
  # a casual's messages go by push, else email, so it needs the SMTP settings below (production
  # refuses console email). MESSAGING_TRANSPORT=console is refused in production, by design.
  worker:
    image: *app-image
    restart: unless-stopped
    # pg-boss lets running jobs finish for up to 30 seconds when it's stopped: give it longer
    # than Docker's default 10 before being killed (a job cut off mid-way would run again).
    stop_grace_period: 45s
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    environment:
      NODE_ENV: production
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:?}
      DATABASE_URL: ${DATABASE_URL:?}
      DATABASE_JOBS_URL: ${DATABASE_JOBS_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      MESSAGING_TRANSPORT: ${MESSAGING_TRANSPORT:-none}
      # Email over SMTP (docs/office-v2.md 5.8): the worker alone sends email, so only it gets the
      # provider's login (SMTP_PASS is a secret; the web app never sees it).
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Claude through the Anthropic API (docs/office-v2.md 5.8): the worker alone asks it, so only
      # it gets the key (a secret; the web app never sees it). Off unless AI_TRANSPORT=anthropic.
      AI_TRANSPORT: ${AI_TRANSPORT:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # Postcodes and travel times (docs/office-v2.md 5.4): fake knows only the made-up ZZ postcodes.
      # With traveltime, TravelTime's keys: the worker alone works out travel times (12G.2).
      TRAVEL_PROVIDER: ${TRAVEL_PROVIDER:-fake}
      TRAVELTIME_APP_ID: ${TRAVELTIME_APP_ID:-}
      TRAVELTIME_API_KEY: ${TRAVELTIME_API_KEY:-}
      # The planner's webhooks (12J.2): the worker alone sends them, signed with secrets derived
      # from INTEGRATIONS_SECRET (the same value as the web app's; a secret). https is the only
      # choice in production.
      INTEGRATIONS_SECRET: ${INTEGRATIONS_SECRET:-}
      WEBHOOK_TRANSPORT: ${WEBHOOK_TRANSPORT:-https}
      # Web push (13.3): none until the VAPID keys are made (PLAN.md Parking lot, "Connect the real
      # web push"); then webpush, with all three. The private key is the worker's alone (a secret).
      PUSH_TRANSPORT: ${PUSH_TRANSPORT:-none}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # The secret store's key (P5.1): it opens each firm's own credentials (npm run firm:secret).
      # The worker's and the owner command's alone, never the web app's (a secret).
      SECRETS_KEY: ${SECRETS_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SHEETS_TRANSPORT: ${SHEETS_TRANSPORT:-none}
      # With SHEETS_TRANSPORT=google: /app/secrets/google-service-account.json (PLAN.md Parking lot,
      # "Connect the real Google Sheets").
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: ${GOOGLE_SERVICE_ACCOUNT_JSON_PATH:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      ALERTS_TRANSPORT: ${ALERTS_TRANSPORT:-console}
      # The ops alerts check the web app from inside the server (docs/runbooks.md "Alerts from the app").
      HEALTH_CHECK_URL: http://web:3000/api/health
      # Its sign of life, read by the health check below (src/worker/heartbeat.ts).
      WORKER_HEARTBEAT_FILE: /tmp/shiftdesk-worker-alive
    # Healthy only while the worker writes its sign of life (every 15 seconds, once it has started):
    # a worker that keeps crashing or hangs is never healthy, so deploy.sh's `up --wait` fails
    # instead of reporting it started.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const f = require('fs'); try { process.exit(Date.now() - f.statSync(process.env.WORKER_HEARTBEAT_FILE).mtimeMs < 60000 ? 0 : 1) } catch { process.exit(1) }"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # The Google service account's key file, next to this file in secrets/ (never in the image or
    # the repo), read-only; only the worker reads it.
    volumes:
      - *db-ca
      - ./secrets:/app/secrets:ro
    logging: *logging

  # One-off: `docker compose run --rm migrate` (deploy.sh does it before every start). Never
  # started by `up` (its profile). The only service with the owner's login.
  migrate:
    image: *app-image
    profiles: ["migrate"]
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    environment:
      NODE_ENV: production
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?}
      DATABASE_URL: ${DATABASE_URL:?}
      DATABASE_JOBS_URL: ${DATABASE_JOBS_URL:?}
    volumes:
      - *db-ca
    logging: *logging

  # One-off, for the owner's commands (docs/runbooks.md "Onboarding a pilot firm"):
  # `docker compose run --rm owner node --import tsx scripts/firm-create.ts …`. Never started by
  # `up` (its profile). Compose reads .env itself, so no secret goes on a command line. The owner's
  # login (to change firms) plus what the app code needs; nothing published.
  owner:
    image: *app-image
    profiles: ["owner"]
    command:
      [
        "node",
        "-e",
        "console.log('Give it an owner command, e.g. node --import tsx scripts/firm-check.ts --firm acme')",
      ]
    environment:
      NODE_ENV: production
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:?}
      DATABASE_URL: ${DATABASE_URL:?}
      DATABASE_JOBS_URL: ${DATABASE_JOBS_URL:?}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      # To seal a firm's secrets so the worker can open them (npm run firm:secret, P5.1).
      SECRETS_KEY: ${SECRETS_KEY:-}
      # To show a connector's webhook secret, worked out from it (npm run firm:connector, P5.3).
      INTEGRATIONS_SECRET: ${INTEGRATIONS_SECRET:-}
    volumes:
      - *db-ca
    logging: *logging

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (for Let's Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *logging

volumes:
  caddy_data: # the certificates: keep it (a new volume means new certificates, and rate limits)
  caddy_config:
